openapi: "3.0.3"
info:
  title: "Sample Pet Store API"
  description: "A sample API for chaos testing demonstrations"
  version: "1.0.0"

servers:
  - url: "http://localhost:8000"

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: species
          in: query
          required: false
          schema:
            type: string
            enum: ["dog", "cat", "bird", "fish"]
        - name: name
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: A list of pets
        "400":
          description: Invalid parameters

    post:
      operationId: createPet
      summary: Create a new pet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - species
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: The pet's name
                species:
                  type: string
                  enum: ["dog", "cat", "bird", "fish"]
                  description: The type of pet
                age:
                  type: integer
                  minimum: 0
                  maximum: 50
                  description: Age in years
                weight:
                  type: number
                  minimum: 0.1
                  maximum: 500.0
                  description: Weight in kg
                vaccinated:
                  type: boolean
                  description: Whether the pet is vaccinated
                tags:
                  type: array
                  description: Tags for the pet
                  items:
                    type: string
      responses:
        "201":
          description: Pet created
        "400":
          description: Invalid input
        "422":
          description: Validation error

  /pets/{petId}:
    get:
      operationId: getPet
      summary: Get a pet by ID
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Pet details
        "404":
          description: Pet not found

    put:
      operationId: updatePet
      summary: Update a pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                age:
                  type: integer
                  minimum: 0
                  maximum: 50
                weight:
                  type: number
                  minimum: 0.1
      responses:
        "200":
          description: Pet updated
        "404":
          description: Pet not found
        "422":
          description: Validation error

    delete:
      operationId: deletePet
      summary: Delete a pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Pet deleted
        "404":
          description: Pet not found

  /pets/{petId}/vaccinations:
    post:
      operationId: addVaccination
      summary: Record a vaccination
      tags:
        - vaccinations
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vaccine_name
                - date
              properties:
                vaccine_name:
                  type: string
                  minLength: 1
                  maxLength: 200
                date:
                  type: string
                  format: date
                notes:
                  type: string
                  maxLength: 1000
      responses:
        "201":
          description: Vaccination recorded
        "400":
          description: Invalid input
        "404":
          description: Pet not found

  /search:
    get:
      operationId: searchPets
      summary: Search for pets
      tags:
        - search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Search query
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Search results
        "400":
          description: Invalid query
