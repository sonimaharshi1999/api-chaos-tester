[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-chaos-tester"
version = "1.0.0"
description = "Intelligent API fuzz testing with ML-based failure prediction"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maharshi Soni"}]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "respx>=0.20.0",
]

[project.scripts]
chaos-test = "api_chaos_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
